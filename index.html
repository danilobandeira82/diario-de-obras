<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário de Obras</title>
<meta name="description" content="Relatório diário de obra que funciona sem internet. Os dados ficam no aparelho.">
<meta name="theme-color" content="#1d3550">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diário">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone.svg">
<style>
:root{
  --bg:#eef1f4; --sup:#ffffff; --sup2:#f6f8fa; --tinta:#11161c; --tinta2:#566271; --tinta3:#8b96a3;
  --linha:#dbe1e7; --aco:#1d3550; --aco2:#2a4a6d;
  --acao:#e8590c; --acao2:#c94a06; --acao-suave:#fdebe0;
  --ok:#1a7f45; --ok-s:#dff3e7; --alerta:#a96a0f; --alerta-s:#fbefd6;
  --erro:#c0262d; --erro-s:#fbe2e3; --info:#1d68ad; --info-s:#dcebf8;
  --r:14px; --sombra:0 1px 2px rgba(17,22,28,.06),0 2px 8px rgba(17,22,28,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tinta)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:96px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}
:focus-visible{outline:3px solid var(--acao);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* topo */
.topo{position:sticky;top:0;z-index:30;background:var(--aco);color:#fff;
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;min-height:56px}
.topo h1{flex:1;margin:0;font-size:17px;font-weight:650;line-height:1.2;min-width:0}
.topo h1 small{display:block;font-size:12px;font-weight:450;color:#b8c6d6;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .ic{background:rgba(255,255,255,.12);border:0;color:#fff;width:40px;height:40px;
  border-radius:11px;display:grid;place-items:center;flex:none}
.topo .ic svg{width:21px;height:21px}
.salvo{font-size:12px;color:#b8c6d6;white-space:nowrap}

/* abas da obra */
.abas{position:sticky;top:56px;z-index:25;background:var(--aco);display:flex;gap:2px;
  padding:0 8px;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{flex:none;background:none;border:0;color:#b8c6d6;padding:11px 13px;font-size:14px;
  font-weight:550;border-bottom:3px solid transparent}
.abas button.on{color:#fff;border-bottom-color:var(--acao)}

main{max-width:880px;margin:0 auto;padding:14px}
.grade2{display:grid;gap:12px}
@media(min-width:900px){ .grade2{grid-template-columns:1fr 1fr;align-items:start} .larga{grid-column:1/-1} }

/* cartões */
.cartao{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);
  box-shadow:var(--sombra);margin-bottom:12px}
.grade2 .cartao{margin-bottom:0}
.cartao-cab{display:flex;align-items:center;gap:10px;padding:13px 15px}
.cartao-cab .ico{width:34px;height:34px;border-radius:10px;background:var(--sup2);display:grid;
  place-items:center;flex:none;color:var(--aco)}
.cartao-cab .ico svg{width:19px;height:19px}
.cartao-cab h2{flex:1;margin:0;font-size:15.5px;font-weight:650}
.cartao-cab .resumo{font-size:12.5px;color:var(--tinta2);font-weight:450;display:block;margin-top:1px}
.cartao-corpo{padding:0 15px 15px}
.marca-ok{width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:grid;
  place-items:center;flex:none}
.marca-ok svg{width:14px;height:14px}
.marca-vazia{width:22px;height:22px;border-radius:50%;border:2px dashed var(--linha);flex:none}

/* botões */
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:650;font-size:15.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn svg{width:19px;height:19px}
.btn.pri{background:var(--acao);color:#fff}
.btn.pri:active{background:var(--acao2)}
.btn.sec{background:var(--sup);color:var(--aco);border:1.5px solid var(--linha)}
.btn.fant{background:none;color:var(--aco);padding:10px 12px;min-height:40px}
.btn.verde{background:var(--ok);color:#fff}
.btn.cheio{width:100%}
.btn:disabled{opacity:.45}
.mais{width:100%;border:1.5px dashed #b9c3ce;background:var(--sup2);color:var(--aco);border-radius:12px;
  padding:12px;font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.mais svg{width:17px;height:17px}

/* chips e segmentos */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--linha);background:var(--sup);border-radius:999px;padding:8px 13px;
  font-size:14px;color:var(--tinta2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--aco);border-color:var(--aco);color:#fff;font-weight:600}
.seg{display:flex;background:var(--sup2);border:1px solid var(--linha);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-size:14px;color:var(--tinta2);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:550}
.seg button svg{width:22px;height:22px}
.seg button.on{background:var(--sup);color:var(--tinta);box-shadow:var(--sombra)}
.seg button.on.sim{color:var(--ok)} .seg button.on.nao{color:var(--erro)}

/* stepper */
.linha-qtd{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #edf0f3}
.linha-qtd:last-child{border-bottom:0}
.linha-qtd .nome{flex:1;font-size:15px;min-width:0}
.linha-qtd.zero .nome{color:var(--tinta3)}
.copiar-bloco{display:flex;align-items:center;gap:7px;width:100%;margin:0 0 12px;padding:9px 12px;border:1.5px dashed var(--acao);border-radius:11px;
  background:var(--acao-suave);color:var(--acao2);font-size:14px;font-weight:600;text-align:left}
.copiar-bloco svg{width:18px;height:18px;flex:none}
.faixa-prazo{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--aco);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px}
.faixa-prazo b{font-size:17px}
.faixa-prazo span{font-size:14.5px;opacity:.9}
.linha-num{padding:9px 0 10px;border-bottom:1px solid #edf0f3}
.linha-num:last-child{border-bottom:0}
.linha-num .nome{display:block;font-size:15px;margin-bottom:6px}
.linha-num.zero .nome{color:var(--tinta3)}
.nums{display:flex;gap:4px}
.nums>button{flex:1 1 0;min-width:0;height:42px;padding:0;border:1.5px solid var(--linha);border-radius:10px;background:var(--sup2);font-size:16px;font-weight:600;color:var(--tinta2)}
.nums>button.on{background:var(--aco);border-color:var(--aco);color:#fff}
.nums .mais1{color:var(--aco);font-size:15px}
.nums .grande{flex:2.6 1 0;min-width:0;display:flex;align-items:center;height:42px;border-radius:10px;background:var(--aco);color:#fff;overflow:hidden}
.nums .grande b{flex:1;text-align:center;font-size:17px}
.nums .grande button{width:34px;height:100%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;font-weight:600}
.passo{display:flex;align-items:center;border:1.5px solid var(--linha);border-radius:11px;overflow:hidden;flex:none}
.passo button{width:42px;height:40px;border:0;background:var(--sup2);font-size:20px;color:var(--aco);font-weight:600}
.passo span{min-width:38px;text-align:center;font-weight:700;font-size:16px}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--sup2);
  border-radius:11px;padding:10px 13px;margin-top:10px;font-weight:650}

/* campos */
label.rot{display:block;font-size:13px;font-weight:600;color:var(--tinta2);margin:12px 0 6px}
.campo{width:100%;border:1.5px solid var(--linha);border-radius:11px;padding:11px 12px;background:var(--sup);
  font-size:16px}
.campo:focus{border-color:var(--aco2);outline:none}
textarea.campo{min-height:96px;resize:vertical}
.dica{font-size:12.5px;color:var(--tinta3);margin:6px 0 0;display:flex;gap:6px;align-items:center}
.dica svg{width:15px;height:15px;flex:none}

/* itens de lista */
.item{border:1px solid var(--linha);border-radius:12px;padding:11px 12px;margin-bottom:9px;background:var(--sup2)}
.item-topo{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.item-topo b{flex:1;font-size:14px}
.x{border:0;background:none;color:var(--tinta3);width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.pilula{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px}
.p-ok{background:var(--ok-s);color:var(--ok)} .p-alerta{background:var(--alerta-s);color:var(--alerta)}
.p-erro{background:var(--erro-s);color:var(--erro)} .p-info{background:var(--info-s);color:var(--info)}
.p-neutro{background:var(--sup2);color:var(--tinta2);border:1px solid var(--linha)}

/* início */
.obra{padding:15px}
.obra-topo{display:flex;gap:12px;align-items:flex-start}
.obra-topo div{flex:1;min-width:0}
.obra h3{margin:0;font-size:17px;line-height:1.25}
.obra .sub{font-size:13.5px;color:var(--tinta2);margin-top:2px}
.prazo{height:6px;background:var(--sup2);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.prazo i{display:block;height:100%;background:var(--aco2)}
.metricas{display:flex;gap:14px;font-size:12.5px;color:var(--tinta2);flex-wrap:wrap}
.metricas b{color:var(--tinta);font-size:14px}
.obra-acoes{display:flex;gap:8px;margin-top:13px}
.obra-acoes .btn{flex:1}
.vazio{text-align:center;padding:40px 18px;color:var(--tinta2)}
.vazio>svg{width:56px;height:56px;color:var(--tinta3)}
.vazio h3{color:var(--tinta);margin:12px 0 6px}

/* calendário */
.cal-topo{display:flex;align-items:center;justify-content:space-between;padding:12px 15px}
.cal-topo b{font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 12px 12px}
.cal .dow{text-align:center;font-size:11px;font-weight:700;color:var(--tinta3);padding:2px 0 4px}
.dia{aspect-ratio:1;border-radius:11px;border:1px solid var(--linha);background:var(--sup);font-weight:650;
  font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  position:relative;color:var(--tinta)}
.dia .pt{width:6px;height:6px;border-radius:50%}
.dia.vz{visibility:hidden}
.dia.ok{background:var(--ok-s);border-color:#a8dcbd;color:var(--ok)}
.dia.parado{background:var(--info-s);border-color:#b2d2ee;color:var(--info)}
.dia.rasc{background:var(--alerta-s);border-color:#efd39b;color:var(--alerta)}
.dia.falta{background:var(--erro-s);border-color:#f0b9bc;color:var(--erro)}
.dia.fut{color:var(--tinta3);background:var(--sup2)}
.dia.antes{color:var(--tinta3);background:transparent;border-style:dashed}
.dia.hoje{outline:2.5px solid var(--acao);outline-offset:1px}
.dia .cam{position:absolute;top:4px;right:5px;width:11px;height:11px;opacity:.7}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 15px 14px;font-size:12px;color:var(--tinta2)}
.legenda i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px}

/* fotos */
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.foto{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;background:var(--sup2);border:1px solid var(--linha)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .leg{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));
  color:#fff;font-size:11px;padding:14px 6px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foto .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;width:28px;height:28px}
.camera{display:flex;gap:8px;margin-bottom:10px}
.camera label{flex:1}
.camera input{display:none}

/* barra de ação inferior */
.barra-acao{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);border-top:1px solid var(--linha);
  padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.barra-acao .dentro{max-width:880px;margin:0 auto;display:flex;gap:9px;align-items:center}
.barra-acao .dentro .btn{flex:1}
.progresso{flex:none;font-size:12.5px;color:var(--tinta2);text-align:center;min-width:64px;line-height:1.2}
.progresso b{display:block;font-size:17px;color:var(--tinta)}

/* folha inferior (modal) */
.fundo{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:60;display:flex;align-items:flex-end;
  justify-content:center;animation:surge .15s ease-out}
.folha{background:var(--sup);width:100%;max-width:620px;max-height:92vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 16px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){ .fundo{align-items:center} .folha{border-radius:20px} }
.folha .alca{width:40px;height:5px;border-radius:9px;background:var(--linha);margin:4px auto 10px}
.folha h3{margin:4px 0 10px;font-size:18px}
@keyframes surge{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){ .fundo{animation:none} }

.aviso{border-radius:12px;padding:11px 13px;font-size:14px;margin-bottom:12px;display:flex;gap:9px;align-items:flex-start}
.aviso svg{width:19px;height:19px;flex:none;margin-top:1px}
.aviso.a{background:var(--alerta-s);color:#6e4508} .aviso.e{background:var(--erro-s);color:#7d1418}
.aviso.i{background:var(--info-s);color:#0f416d} .aviso.o{background:var(--ok-s);color:#0f5130}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tinta);color:#fff;
  padding:11px 17px;border-radius:12px;font-size:14px;z-index:80;box-shadow:0 6px 24px rgba(0,0,0,.25);
  max-width:90vw}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);padding:13px 14px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--tinta2)}
.barras{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.barras div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.barras i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--aco2)}
.barras small{font-size:10.5px;color:var(--tinta3)}

.assin{border:1.5px dashed var(--linha);border-radius:12px;background:#fff;touch-action:none;width:100%;height:150px;display:block}
.assin-img{border:1px solid var(--linha);border-radius:12px;background:#fff;width:100%;max-height:150px;object-fit:contain}

.lista-sec .linha{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f3}
.lista-sec .linha:last-child{border-bottom:0}
.lista-sec .linha span{flex:1}
.interruptor{width:50px;height:30px;border-radius:99px;background:#c9d1d9;border:0;position:relative;flex:none}
.interruptor::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.interruptor.on{background:var(--ok)} .interruptor.on::after{left:23px}

/* impressão */
#impressao{display:none}
@media print{
  @page{size:A4;margin:11mm}
  body{background:#fff;padding:0}
  body>*:not(#impressao){display:none !important}
  #impressao{display:block !important}
}

.seletor{width:100%;display:flex;align-items:center;gap:8px;border:1.5px solid var(--linha);background:var(--sup);
  border-radius:11px;padding:11px 12px;margin-bottom:8px;text-align:left;font-weight:600;font-size:15px;color:var(--tinta)}
.seletor span{flex:1}
.seletor svg{color:var(--tinta3)}
.seletor.vazio{color:var(--acao);border-style:dashed;border-color:#f3b48f;background:var(--acao-suave)}

</style>
</head>

<script>
'use strict';
/* =====================================================================
 * BASE — utilitários, ícones e banco local (IndexedDB)
 * ===================================================================== */

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const isoDe = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hojeIso = () => isoDe(new Date());
const dataDe = iso => { const p = String(iso).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
const br = iso => { if (!iso) return '—'; const p = String(iso).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
const somaDias = (iso, n) => { const d = dataDe(iso); d.setDate(d.getDate() + n); return isoDe(d); };
const difDias = (a, b) => Math.round((dataDe(b) - dataDe(a)) / 86400000);
const SEMANA = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const extenso = iso => { const d = dataDe(iso); return SEMANA[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const mb = n => (n / 1048576).toFixed(n < 10485760 ? 1 : 0).replace('.', ',') + ' MB';

/* ---- ícones (traço, 24px) ---- */
const P = {
  voltar:'<path d="M15 18l-6-6 6-6"/>',
  config:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  mais:'<path d="M12 5v14M5 12h14"/>',
  ok:'<path d="M20 6L9 17l-5-5"/>',

/* =====================================================================
 * BANCO LOCAL
 * Lojas: config (chave única), obras, rdos (obraId|data), fotos, docs.
 * Fotos e documentos guardados como Blob (menor que base64).
 * Se o IndexedDB faltar, roda em memória e avisa.
 * ===================================================================== */
const Banco = {
  db: null, motor: 'memoria', mem: { config:{}, obras:{}, rdos:{}, fotos:{}, docs:{} },

  abrir() {
    return new Promise(res => {
      let req;
      try { req = indexedDB.open('diario-obras-v2', 1); } catch (e) { return res(this); }
      req.onupgradeneeded = () => {
        const d = req.result;
        ['config','obras','rdos','fotos','docs'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); });
      };
      req.onsuccess = () => { this.db = req.result; this.motor = 'indexeddb'; res(this); };
      req.onerror = req.onblocked = () => res(this);
    }).then(() => {
      // pede ao navegador para não apagar estes dados quando faltar espaço
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      return this;
    });
  },

  _op(loja, modo, fn) {
    if (!this.db) {
      const m = this.mem[loja];
      return Promise.resolve(fn({
        get: k => ({ result: m[k] }), put: (v, k) => { m[k] = v; }, delete: k => { delete m[k]; },
        getAll: () => ({ result: Object.values(m) }), getAllKeys: () => ({ result: Object.keys(m) }),
        clear: () => { for (const k in m) delete m[k]; }
      }, true));
    }
    return new Promise((res, rej) => {
      const t = this.db.transaction(loja, modo);
      const r = fn(t.objectStore(loja));
      t.oncomplete = () => res(r && r.result);
      t.onerror = t.onabort = () => rej(t.error || new Error('Falha ao gravar'));
    });
  },
  ler(loja, k) { return this._op(loja, 'readonly', s => s.get(k)).then(r => r && r.result !== undefined ? r.result : r); },
  gravar(loja, k, v) { return this._op(loja, 'readwrite', s => { s.put(v, k); }); },
  apagar(loja, k) { return this._op(loja, 'readwrite', s => { s.delete(k); }); },
  todos(loja) { return this._op(loja, 'readonly', s => s.getAll()).then(r => (r && r.result) || r || []); },
  chaves(loja) { return this._op(loja, 'readonly', s => s.getAllKeys()).then(r => (r && r.result) || r || []); },
  limpar(loja) { return this._op(loja, 'readwrite', s => { s.clear(); }); },
  espaco() {
    if (!navigator.storage || !navigator.storage.estimate) return Promise.resolve(null);
    return navigator.storage.estimate().then(e => ({ usado: e.usage || 0, total: e.quota || 0 })).catch(() => null);
  }
};

/* ---- leitura de arquivos e compressão de fotos ---- */
const lerComo = (arq, modo) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result); r.onerror = () => rej(r.error);
  modo === 'url' ? r.readAsDataURL(arq) : r.readAsArrayBuffer(arq);
});
const blobParaUrl = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
const urlParaBlob = u => fetch(u).then(r => r.blob());

/* carimbo: texto escrito no canto da foto (data e hora), para valer como registro */
function comprimirFoto(arq, max, carimbo) {
  max = max || 1600;
  return lerComo(arq, 'url').then(url => new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      if (Math.max(w, h) > max) { const f = max / Math.max(w, h); w = Math.round(w * f); h = Math.round(h * f); }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const g = cv.getContext('2d'); g.drawImage(img, 0, 0, w, h);
      if (carimbo) {
        const fs = Math.max(14, Math.round(Math.min(w, h) * 0.035)), pad = Math.round(fs * 0.45);
        g.font = 'bold ' + fs + 'px Arial, sans-serif';
        const tw = g.measureText(carimbo).width;
        g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(w - tw - pad * 3, h - fs - pad * 3, tw + pad * 2, fs + pad * 2);
        g.fillStyle = '#ffd400'; g.textBaseline = 'top'; g.fillText(carimbo, w - tw - pad * 2, h - fs - pad * 2);
      }
      cv.toBlob(b => b ? res(b) : rej(new Error('Não foi possível processar a foto.')), 'image/jpeg', 0.78);
    };
    img.onerror = () => rej(new Error('Arquivo de imagem inválido.'));
    img.src = url;
  }));
}

/* ---- interface: toast, folha, confirmar ---- */
function toast(msg, ms) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms || 2200);
}
function abrirFolha(html, aoMontar) {
  fecharFolha();

  f.innerHTML = '<div class="folha" role="dialog" aria-modal="true"><div class="alca"></div>' + html + '</div>';
  f.addEventListener('click', e => { if (e.target === f) fecharFolha(); });
  document.body.appendChild(f);
  if (aoMontar) aoMontar(f);
  return f;
}
function fecharFolha() { const f = $('#folha'); if (f) f.remove(); }

      f => f.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { fecharFolha(); res(b.dataset.r === '1'); }));
  });
}
function baixarArquivo(nome, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* Status de um dia para o calendário */
function statusDia(obra, iso) {
  const r = App.rdos[chaveRdo(obra.id, iso)];
  const hoje = hojeIso();
  if (iso < obra.inicio) return 'antes';
  if (r && r.status === 'concluido') return r.clima && r.clima.houve === false ? 'parado' : 'ok';
  if (r) return 'rasc';
  return iso < hoje ? 'falta' : (iso === hoje ? 'hoje-vazio' : 'fut');
}
function diasFaltando(obra) {
  const fim = somaDias(hojeIso(), -1); let n = 0;
  if (!obra.inicio || obra.inicio > fim) return 0;
  for (let d = obra.inicio; d <= fim; d = somaDias(d, 1)) if (!App.rdos[chaveRdo(obra.id, d)]) n++;
  return n;
}
function prazoDe(obra, iso) {
  if (!obra.inicio) return null;
  const dia = difDias(obra.inicio, iso) + 1, total = +obra.prazoDias || 0;
  return { dia, total, restam: total ? total - dia : null };
}
/* "Dia 10 de 365 · faltam 355" — conta dias corridos (sábado e domingo entram) */
function textoPrazo(pz) {
  if (!pz) return '';
  if (pz.dia < 1) return 'antes do início da obra';
  if (!pz.total) return 'Dia ' + pz.dia;
  if (pz.restam < 0) return 'Dia ' + pz.dia + ' de ' + pz.total + ' · prazo vencido há ' + (-pz.restam) + ' dia' + (pz.restam === -1 ? '' : 's');
  return 'Dia ' + pz.dia + ' de ' + pz.total + ' · falta' + (pz.restam === 1 ? ' 1 dia' : 'm ' + pz.restam + ' dias');
}
const docsFaltando = obra => DOCS_EXIGIDOS.filter(t => !(obra.docs || []).some(d => d.tipo === t));

/* ---------------- navegação ---------------- */
function ir(h) { if (location.hash === h) render(); else location.hash = h; }
window.addEventListener('hashchange', render);

function lerRota() {
  const p = (location.hash.replace(/^#\/?/, '') || '').split('/').map(decodeURIComponent);
  if (p[0] === 'config') return { tela: 'config' };
  if (p[0] === 'obra' && p[1] === 'nova') return { tela: 'obraForm' };
  if (p[0] === 'obra' && p[2] === 'editar') return { tela: 'obraForm', id: p[1] };
  if (p[0] === 'obra' && p[2] === 'dia') return { tela: 'rdo', id: p[1], data: p[3] };
  if (p[0] === 'obra') return { tela: 'obra', id: p[1], aba: p[2] || 'diario' };
  return { tela: 'inicio' };
}

function topo(titulo, sub, voltar, direita) {
  return '<header class="topo">' +
    (voltar ? '<button class="ic" data-a="voltar" data-h="' + esc(voltar) + '" aria-label="Voltar">' + ic('voltar') + '</button>' : '') +
    '<h1>' + esc(titulo) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</h1>' + (direita || '') + '</header>';
}

function render() {
  fecharFolha();
  App.rota = lerRota();
  const r = App.rota;
  const corpo = $('#app');
  let html = '';
  if (r.tela === 'inicio') html = telaInicio();
  else if (r.tela === 'config') html = telaConfig();
  else if (r.tela === 'obraForm') html = telaObraForm(r.id);
  else if (r.tela === 'obra') html = obraPor(r.id) ? telaObra(obraPor(r.id), r.aba) : telaInicio();
  else if (r.tela === 'rdo') html = obraPor(r.id) ? telaRdo(obraPor(r.id), r.data) : telaInicio();
  corpo.innerHTML = html;
  window.scrollTo(0, 0);
  if (App.aposRender) { const f = App.aposRender; App.aposRender = null; f(); }
}

      : st === 'rasc' ? '<span class="pilula p-alerta">Hoje em rascunho</span>'
      : o.inicio > hoje ? '<span class="pilula p-neutro">Começa ' + br(o.inicio) + '</span>'
      : '<span class="pilula p-neutro">Hoje não iniciado</span>';
    const pct = pz && pz.total ? Math.min(100, Math.max(0, pz.dia / pz.total * 100)) : 0;
    h += '<div class="cartao obra">' +
      '<div class="obra-topo"><div><h3>' + esc(o.nome) + '</h3><div class="sub">' + esc(o.cliente || '—') + '</div></div>' + pil + '</div>' +
      (pz && pz.total ? '<div class="prazo"><i style="width:' + pct + '%"></i></div>' : '<div style="height:10px"></div>') +
      '<div class="metricas num">' +
        (pz && pz.dia > 0 ? '<span><b>' + pz.dia + '</b>' + (pz.total ? ' de ' + pz.total : '') + ' dias</span>' : '') +
        (pz && pz.restam != null && pz.dia > 0 ? '<span><b>' + pz.restam + '</b> restantes</span>' : '') +
        '<span><b>' + rdosDa(o.id).filter(x => x.status === 'concluido').length + '</b> diários fechados</span>' +
        (falta ? '<span style="color:var(--erro)"><b style="color:var(--erro)">' + falta + '</b> dias sem lançamento</span>' : '') +
      '</div>' +
      '<div class="obra-acoes">' +
        '<button class="btn sec" data-a="ir" data-h="#/obra/' + o.id + '/diario">' + ic('calendario') + 'Abrir obra</button>' +
        (o.inicio <= hoje ? '<button class="btn pri" data-a="ir" data-h="#/obra/' + o.id + '/dia/' + hoje + '">' + ic('caneta') +
          (r ? 'Continuar hoje' : 'Preencher hoje') + '</button>' : '') +
      '</div></div>';
  });

  if (ativas.length) h += '<button class="mais" data-a="ir" data-h="#/obra/nova">' + ic('mais') + 'Nova obra</button>';
  const arq = App.obras.filter(o => o.arquivada);
  if (arq.length) h += '<p style="text-align:center;margin-top:18px;font-size:13.5px;color:var(--tinta2)">' + arq.length +
    ' obra(s) arquivada(s) — veja em <a href="#/config">Configurações</a></p>';
  return h + '</main>';
}

/* ---------------- OBRA (abas) ---------------- */
function telaObra(o, aba) {
  const pz = prazoDe(o, hojeIso());
  let h = topo(o.nome, (o.cliente || '') + (pz && pz.dia > 0 ? ' · dia ' + pz.dia + (pz.total ? ' de ' + pz.total : '') : ''), '#/');
  const abas = [['diario','Diário'],['fotos','Fotos'],['indicadores','Resumo'],['relatorios','Relatórios'],['cadastro','Obra']];
  h += '<nav class="abas">' + abas.map(a => '<button class="' + (a[0] === aba ? 'on' : '') + '" data-a="ir" data-h="#/obra/' +
    o.id + '/' + a[0] + '">' + a[1] + '</button>').join('') + '</nav><main>';
  if (aba === 'diario') h += abaDiario(o);
  else if (aba === 'fotos') h += abaFotos(o);
  else if (aba === 'indicadores') h += abaIndicadores(o);
  else if (aba === 'relatorios') h += abaRelatorios(o);
  else h += abaCadastro(o);
  return h + '</main>';
}

function abaDiario(o) {
  let h = '';
  const falta = docsFaltando(o);
  if (falta.length) h += '<div class="aviso a">' + ic('clipe') + '<div><b>Falta anexar: ' + esc(falta.join(' e ')) + '.</b> ' +
    'Anexe na aba <a href="#/obra/' + o.id + '/cadastro" style="color:inherit">Obra</a> para manter a documentação completa.</div></div>';

  if (!App.mes) { const d = new Date(); App.mes = [d.getFullYear(), d.getMonth()]; }
  const [ano, mes] = App.mes;
  const prim = new Date(ano, mes, 1), nd = new Date(ano, mes + 1, 0).getDate();
  const hoje = hojeIso();
  h += '<div class="cartao"><div class="cal-topo">' +
    '<button class="btn fant" data-a="mes" data-d="-1" aria-label="Mês anterior">' + ic('voltar') + '</button>' +
    '<b>' + cap(MESES[mes]) + ' de ' + ano + '</b>' +
    '<button class="btn fant" data-a="mes" data-d="1" aria-label="Próximo mês" style="transform:scaleX(-1)">' + ic('voltar') + '</button></div>' +
    '<div class="cal">' + ['D','S','T','Q','Q','S','S'].map(x => '<div class="dow">' + x + '</div>').join('');
  for (let i = 0; i < prim.getDay(); i++) h += '<div class="dia vz"></div>';
  for (let d = 1; d <= nd; d++) {
    const iso = ano + '-' + pad(mes + 1) + '-' + pad(d);
    const st = statusDia(o, iso);
    const cls = { ok:'ok', parado:'parado', rasc:'rasc', falta:'falta', fut:'fut', antes:'antes', 'hoje-vazio':'' }[st];
    const r = App.rdos[chaveRdo(o.id, iso)];
    const temFoto = r && r.fotos && r.fotos.length;
    const clicavel = st !== 'fut' && st !== 'antes';
    h += '<button class="dia ' + cls + (iso === hoje ? ' hoje' : '') + '" ' +
      (clicavel ? 'data-a="ir" data-h="#/obra/' + o.id + '/dia/' + iso + '"' : 'disabled') + ' aria-label="' + br(iso) + '">' +
      (temFoto ? ic('camera', 'cam') : '') + '<span class="num">' + d + '</span></button>';
  }
  h += '</div><div class="legenda">' +
    [['var(--ok-s)','fechado'],['var(--info-s)','sem expediente'],['var(--alerta-s)','rascunho'],['var(--erro-s)','sem lançamento']]
      .map(l => '<span><i style="background:' + l[0] + '"></i>' + l[1] + '</span>').join('') + '</div></div>';

  // últimos lançamentos
  const ult = rdosDa(o.id).sort((a, b) => b.data < a.data ? -1 : 1).slice(0, 6);
  if (ult.length) {
    h += '<div class="cartao"><div class="cartao-cab"><div class="ico">' + ic('relogio') + '</div><h2>Últimos lançamentos</h2></div><div class="cartao-corpo">';
    ult.forEach(r => {
      const tot = totalMao(r);
      h += '<button class="item" style="width:100%;text-align:left;display:flex;align-items:center;gap:10px" data-a="ir" data-h="#/obra/' + o.id + '/dia/' + r.data + '">' +
        '<div style="flex:1;min-width:0"><b>' + cap(extenso(r.data)) + '</b><div style="font-size:13px;color:var(--tinta2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
        (r.clima && r.clima.houve === false ? 'Sem expediente — ' + esc(r.clima.motivo || '') :
          tot + ' trabalhadores · ' + (r.atividades || []).length + ' serviço(s) · ' + (r.fotos || []).length + ' foto(s)') + '</div></div>' +
        (r.status === 'concluido' ? '<span class="pilula p-ok">Fechado</span>' : '<span class="pilula p-alerta">Rascunho</span>') + '</button>';
    });
    h += '</div></div>';
  }
  return h;
}

/* ---------------- FOTOS da obra ---------------- */
function abaFotos(o) {
  const dias = rdosDa(o.id).filter(r => (r.fotos || []).length).sort((a, b) => b.data < a.data ? -1 : 1);
  if (!dias.length) return '<div class="cartao vazio">' + ic('galeria') + '<h3>Nenhuma foto ainda</h3><p>As fotos tiradas no diário aparecem aqui, organizadas por dia.</p></div>';
  App.aposRender = carregarMiniaturas;
  return dias.map(r => '<div class="cartao"><div class="cartao-cab"><h2>' + cap(extenso(r.data)) + '</h2>' +
    '<span class="pilula p-neutro">' + r.fotos.length + '</span></div><div class="cartao-corpo"><div class="galeria">' +
    r.fotos.map(f => '<button class="foto" data-a="verFoto" data-id="' + f.id + '" data-leg="' + esc(f.legenda || '') + '">' +
      '<img data-foto="' + f.id + '" alt="' + esc(f.legenda || 'foto') + '">' + (f.legenda ? '<span class="leg">' + esc(f.legenda) + '</span>' : '') + '</button>').join('') +
    '</div></div></div>').join('');
}
const _urls = {};
function urlFoto(id) {
  if (_urls[id]) return Promise.resolve(_urls[id]);
  return Banco.ler('fotos', id).then(f => f && f.blob ? (_urls[id] = URL.createObjectURL(f.blob)) : '');
}
function carregarMiniaturas() {
  document.querySelectorAll('img[data-foto]').forEach(img => urlFoto(img.dataset.foto).then(u => { if (u) img.src = u; }));
}

/* ---------------- INDICADORES ---------------- */
function abaIndicadores(o) {
  const rs = rdosDa(o.id);
  if (!rs.length) return '<div class="cartao vazio">' + ic('grafico') + '<h3>Sem dados ainda</h3><p>Os indicadores aparecem conforme o diário é preenchido.</p></div>';
  const trab = rs.filter(r => !r.clima || r.clima.houve !== false);
  const chuva = rs.filter(r => r.clima && (r.clima.manha === 'chuva' || r.clima.tarde === 'chuva' ||
    r.clima.manha === 'impraticavel' || r.clima.tarde === 'impraticavel' || r.clima.motivo === 'Chuva')).length;
  const efs = trab.map(totalMao).filter(n => n > 0);
  const media = efs.length ? Math.round(efs.reduce((a, b) => a + b, 0) / efs.length) : 0;
  const ocor = rs.reduce((n, r) => n + (r.ocorrencias || []).length, 0);
  const impacto = rs.reduce((n, r) => n + (r.ocorrencias || []).reduce((m, x) => m + (+x.impacto || 0), 0), 0);
  const fotos = rs.reduce((n, r) => n + (r.fotos || []).length, 0);
  const pz = prazoDe(o, hojeIso());
  const falta = diasFaltando(o);
  let h = '<div class="kpis">' +
    kpi(rs.filter(r => r.status === 'concluido').length, 'diários fechados') +
    kpi(falta, 'dias sem lançamento', falta ? 'var(--erro)' : '') +
    kpi(media, 'efetivo médio por dia') +
    kpi(chuva, 'dias com chuva') +
    kpi(ocor, 'ocorrências') +
    kpi(impacto, 'dias de impacto no prazo', impacto ? 'var(--alerta)' : '') +
    kpi(fotos, 'fotos') +
    kpi(pz && pz.restam != null ? pz.restam : '—', 'dias de prazo restantes') + '</div>';

  // efetivo dos últimos 14 dias
  const ult = []; for (let i = 13; i >= 0; i--) ult.push(somaDias(hojeIso(), -i));
  const vals = ult.map(d => { const r = App.rdos[chaveRdo(o.id, d)]; return r ? totalMao(r) : 0; });
  const mx = Math.max(1, ...vals);
  h += '<div class="cartao" style="margin-top:12px"><div class="cartao-cab"><div class="ico">' + ic('pessoas') + '</div><h2>Efetivo — últimos 14 dias</h2></div>' +
    '<div class="cartao-corpo"><div class="barras">' + vals.map((v, i) => '<div title="' + br(ult[i]) + ': ' + v + '">' +
      '<small class="num">' + (v || '') + '</small><i style="height:' + (v / mx * 88) + '%;' + (v ? '' : 'background:var(--linha);height:3px') + '"></i>' +
      '<small>' + dataDe(ult[i]).getDate() + '</small></div>').join('') + '</div></div></div>';

  // frentes mais trabalhadas
  const fr = {};
  rs.forEach(r => (r.atividades || []).forEach(a => { if (a.frente) fr[a.frente] = (fr[a.frente] || 0) + 1; }));
  const top = Object.entries(fr).sort((a, b) => b[1] - a[1]).slice(0, 8);
  if (top.length) {
    const m2 = top[0][1];
    h += '<div class="cartao"><div class="cartao-cab"><div class="ico">' + ic('lista') + '</div><h2>Frentes com mais dias de serviço</h2></div><div class="cartao-corpo">' +
      top.map(([n, v]) => '<div style="display:flex;align-items:center;gap:10px;margin:7px 0"><span style="width:44%;font-size:14px">' + esc(n) +
        '</span><span style="flex:1;height:10px;background:var(--sup2);border-radius:9px;overflow:hidden"><i style="display:block;height:100%;width:' +
        (v / m2 * 100) + '%;background:var(--acao)"></i></span><b class="num" style="width:28px;text-align:right">' + v + '</b></div>').join('') + '</div></div>';
  }
  return h;
}
const kpi = (v, t, cor) => '<div class="kpi"><b' + (cor ? ' style="color:' + cor + '"' : '') + '>' + v + '</b><span>' + t + '</span></div>';

/* ---------------- CADASTRO DA OBRA (aba) ---------------- */
function abaCadastro(o) {

  h += '<div class="cartao"><div class="cartao-cab"><div class="ico">' + ic('predio') + '</div><h2>Dados da obra</h2>' +

  (o.docs || []).forEach(d => {
    h += '<div class="item" style="display:flex;align-items:center;gap:8px"><div style="flex:1;min-width:0"><b style="font-size:14px">' + esc(d.tipo) + '</b>' +
      '<div style="font-size:12.5px;color:var(--tinta2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(d.nome) + '</div></div>' +
      '<button class="btn fant" data-a="abrirDoc" data-id="' + d.id + '">Abrir</button>' +
      '<button class="x" data-a="apagarDoc" data-id="' + d.id + '" aria-label="Remover">' + ic('lixo') + '</button></div>';
  });
  const falta = docsFaltando(o);
  if (falta.length) h += '<p class="dica">' + ic('alerta') + 'Faltam: ' + esc(falta.join(', ')) + '</p>';
  h += '<label class="rot">Anexar documento</label><select class="campo" id="docTipo">' +
    TIPOS_DOC.map(t => '<option' + (t === falta[0] ? ' selected' : '') + '>' + t + '</option>').join('') + '</select>' +
    '<label class="btn sec cheio" style="margin-top:9px">' + ic('subir') + 'Escolher arquivo' +
    '<input type="file" hidden data-c="anexarDoc"></label></div></div>';

  // equipe e equipamentos padrão
  h += '<div class="cartao"><div class="cartao-cab"><div class="ico">' + ic('pessoas') + '</div><h2>Equipe padrão</h2></div><div class="cartao-corpo">' +
    '<p class="dica" style="margin:0 0 10px">Essas funções aparecem prontas todo dia — o engenheiro só ajusta a quantidade.</p>' +
    '<div class="chips">' + FUNCOES.map(f => '<button class="chip ' + ((o.equipePadrao || []).includes(f) ? 'on' : '') +
      '" data-a="toggleLista" data-campo="equipePadrao" data-v="' + esc(f) + '">' + esc(f) + '</button>').join('') + '</div></div></div>';

  h += '<div class="cartao"><div class="cartao-cab"><div class="ico">' + ic('caminhao') + '</div><h2>Equipamentos padrão</h2></div><div class="cartao-corpo">' +
    '<div class="chips">' + EQUIPAMENTOS.map(f => '<button class="chip ' + ((o.equipPadrao || []).includes(f) ? 'on' : '') +
      '" data-a="toggleLista" data-campo="equipPadrao" data-v="' + esc(f) + '">' + esc(f) + '</button>').join('') + '</div></div></div>';

  // seções
  const sec = Object.assign({}, SECOES_PADRAO, o.secoes || {});
  h += '<div class="cartao larga"><div class="cartao-cab"><div class="ico">' + ic('lista') + '</div><h2>O que entra no diário desta obra</h2></div>' +
    '<div class="cartao-corpo lista-sec"><p class="dica" style="margin:0 0 4px">Desligue o que esta obra não precisa. O diário fica mais curto.</p>' +
    SECOES.map(s => '<div class="linha"><span>' + s[1] + '</span>' +
      (s[0] === 'clima' ? '<span class="pilula p-neutro">sempre</span>' :
        '<button class="interruptor ' + (sec[s[0]] ? 'on' : '') + '" data-a="toggleSecao" data-s="' + s[0] + '" aria-label="' + s[1] + '"></button>') +
      '</div>').join('') + '</div></div>';

  h += '<div class="larga" style="display:flex;gap:9px;flex-wrap:wrap">' +
    '<button class="btn sec" data-a="arquivarObra">' + (o.arquivada ? 'Desarquivar obra' : 'Arquivar obra') + '</button>' +
    '<button class="btn fant" style="color:var(--erro)" data-a="excluirObra">' + ic('lixo') + 'Excluir obra</button></div>';
  return h + '</div>';
}

    '<button class="btn pri cheio" data-a="backup">' + ic('baixar') + 'Salvar cópia de segurança</button>' +
    '<label class="btn sec cheio" style="margin-top:9px">' + ic('subir') + 'Restaurar uma cópia<input type="file" accept=".json,application/json" hidden data-c="restaurar"></label>' +
    '<label class="rot" style="margin-top:16px">Para o escritório / diretoria</label>' +
    '<p style="font-size:13.5px;color:var(--tinta2);margin:0 0 8px">Recebeu a cópia de segurança de um engenheiro? Junte aqui para ver as obras dele neste aparelho. ' +
    'Não apaga nada do que já está aqui; se a mesma obra vier de novo, os diários são atualizados.</p>' +
    '<label class="btn pri cheio">' + ic('subir') + 'Juntar diários recebidos<input type="file" accept=".json,application/json" multiple hidden data-c="juntar"></label></div></div>';

  h += '<div class="cartao"><div class="cartao-cab"><div class="ico">' + ic('config') + '</div><h2>Este aparelho</h2></div><div class="cartao-corpo" id="diag">' +
    '<p style="font-size:14px;margin:0 0 6px"><b>Guardando em:</b> ' + (Banco.motor === 'indexeddb' ? 'banco do navegador (IndexedDB)' : '<span style="color:var(--erro)">somente memória — não salva</span>') + '</p>' +
    '<p style="font-size:14px;margin:0 0 12px" id="espaco">Calculando espaço…</p>' +
    '<button class="btn sec cheio" data-a="testar">Testar este aparelho</button></div></div>';

  const arq = App.obras.filter(o => o.arquivada);
  if (arq.length) h += '<div class="cartao"><div class="cartao-cab"><div class="ico">' + ic('caixa') + '</div><h2>Obras arquivadas</h2></div><div class="cartao-corpo">' +
    arq.map(o => '<button class="item" style="width:100%;text-align:left" data-a="ir" data-h="#/obra/' + o.id + '/diario"><b>' + esc(o.nome) + '</b></button>').join('') + '</div></div>';

  App.aposRender = () => Banco.espaco().then(e => {
    const el = $('#espaco'); if (!el) return;
    el.innerHTML = e ? '<b>Espaço:</b> ' + mb(e.usado) + ' usados de ' + mb(e.total) + ' disponíveis' : '<b>Espaço:</b> não informado pelo navegador';
  });
  return h + '</div></main>';
}

/* =====================================================================
 * RDO — o diário do dia, numa página só, salvando sozinho
 * ===================================================================== */
const totalMao = r => {
  let t = 0;
  Object.values((r && r.maoDeObra) || {}).forEach(v => t += +v || 0);
  ((r && r.terceiros) || []).forEach(x => t += +x.qtd || 0);
  return t;
};

function novoRdo(o, data) {
  const mao = {}; (o.equipePadrao || EQUIPE_PADRAO).forEach(f => mao[f] = 0);
  const eq = {}; (o.equipPadrao || EQUIP_PADRAO).forEach(f => eq[f] = 0);
  return { obraId: o.id, data, status: 'rascunho', criadoEm: new Date().toISOString(),
    clima: { houve: true, motivo: '', manha: '', tarde: '', horasParadas: 0, chuvaMm: null },
    maoDeObra: mao, terceiros: [], atividades: [], equipamentos: eq, fotos: [], ocorrencias: [],
    seguranca: { dds: null, tema: '', acidente: null, descAcidente: '' }, materiais: [], visitas: [],
    observacoes: '', assinaturas: { responsavel: { nome: o.engenheiro || App.config.responsavel || '', img: '' },
      fiscal: { nome: o.fiscalNome || '', img: '' } }, nada: {} };
}

function secoesVisiveis(o, r) {
  const ativas = Object.assign({}, SECOES_PADRAO, o.secoes || {});
  return SECOES.filter(s => {
    if (s[0] !== 'clima' && !ativas[s[0]]) return false;
    if (r.clima.houve === false) return ['clima', 'fotos', 'observacoes', 'assinaturas'].includes(s[0]);
    return true;
  }).map(s => s[0]);
}

function preenchida(sec, r) {
  const n = r.nada || {};
  switch (sec) {
    case 'clima': return r.clima.houve === false ? !!r.clima.motivo : !!(r.clima.manha && r.clima.tarde);
    case 'maoDeObra': return totalMao(r) > 0;
    case 'atividades': return r.atividades.some(a => (a.descricao || '').trim() || a.frente);
    case 'equipamentos': return n.equipamentos || Object.values(r.equipamentos).some(v => v > 0);
    case 'fotos': return n.fotos || r.fotos.length > 0;
    case 'ocorrencias': return n.ocorrencias || r.ocorrencias.length > 0;
    case 'seguranca': return r.seguranca.dds !== null && r.seguranca.acidente !== null;
    case 'materiais': return n.materiais || r.materiais.length > 0;
    case 'visitas': return n.visitas || r.visitas.length > 0;
    case 'observacoes': return n.observacoes || !!(r.observacoes || '').trim();
    case 'assinaturas': return !!(r.assinaturas.responsavel && r.assinaturas.responsavel.img);
  }
  return false;
}

/* ---------------- a tela ---------------- */
function telaRdo(o, data) {
  const k = chaveRdo(o.id, data);
  const r = App.rdos[k] ? JSON.parse(JSON.stringify(App.rdos[k])) : novoRdo(o, data);
  r.nada = r.nada || {};
  App.rdoAtual = r; App.obraAtual = o;
  const pz = prazoDe(o, data);
  let h = topo(cap(extenso(data)), o.nome,
    '#/obra/' + o.id + '/diario', '<span class="salvo" id="salvo">' + (App.rdos[k] ? 'Salvo' : '') + '</span>');
  h += '<main>';

  if (r.status === 'concluido')
    h += '<div class="aviso o">' + ic('ok') + '<div><b>Diário fechado' + (r.concluidoEm ? ' em ' + br(r.concluidoEm.slice(0, 10)) : '') +
      '.</b> Você ainda pode corrigir; a alteração fica registrada.</div></div>';

  if (pz) h += '<div class="faixa-prazo"><b>RDO nº ' + Math.max(pz.dia, 0) + '</b><span>' + textoPrazo(pz) + '</span></div>';

  // atalho: copiar do último dia
  const vazio = !App.rdos[k] || (totalMao(r) === 0 && !r.atividades.length);
  const ant = rdosDa(o.id).filter(x => x.data < data).sort((a, b) => b.data < a.data ? -1 : 1)[0];
  App.rdoAnterior = ant || null;
  if (vazio) {
    if (ant) h += '<button class="cartao" data-a="copiarAnterior" style="width:100%;display:flex;align-items:center;gap:12px;padding:14px 15px;text-align:left;border-color:var(--acao)">' +
      '<span class="ico" style="width:40px;height:40px;border-radius:11px;background:var(--acao-suave);color:var(--acao);display:grid;place-items:center;flex:none">' + ic('copiar') + '</span>' +
      '<span style="flex:1"><b style="display:block">Começar copiando ' + br(ant.data) + '</b><span style="font-size:13px;color:var(--tinta2)">' +
      'Copia todos os blocos de uma vez — ou use "copiar" em cada bloco</span></span>' + ic('seta') + '</button>';
  }

  h += '<div class="grade2" id="cartoes">' + secoesVisiveis(o, r).map(s => cartao(s, r, o)).join('') + '</div>';
  h += '</main>' + barraRdo(o, r);
  App.aposRender = () => { carregarMiniaturas(); montarAssinaturas(); };
  return h;
}

function barraRdo(o, r) {
  const vis = secoesVisiveis(o, r), ok = vis.filter(s => preenchida(s, r)).length;
  return '<div class="barra-acao"><div class="dentro">' +
    '<div class="progresso" id="prog"><b class="num">' + ok + '/' + vis.length + '</b>blocos</div>' +
    '<button class="btn ' + (ok === vis.length ? 'verde' : 'pri') + '" data-a="concluir" id="btConcluir">' + ic('ok') +
    (r.status === 'concluido' ? 'Salvar e fechar' : 'Concluir o dia') + '</button></div></div>';
}

function cartao(sec, r, o) {
  const def = SECOES.find(s => s[0] === sec);
  const ok = preenchida(sec, r);
  return '<section class="cartao' + (['atividades','fotos','observacoes'].includes(sec) ? ' larga' : '') + '" id="c-' + sec + '">' +
    '<div class="cartao-cab"><div class="ico">' + ic(def[2]) + '</div><h2>' + def[1] +
    '<span class="resumo">' + esc(resumoSecao(sec, r)) + '</span></h2>' +
    (ok ? '<span class="marca-ok" title="preenchido">' + ic('ok') + '</span>' : '<span class="marca-vazia" title="não preenchido"></span>') +
    '</div><div class="cartao-corpo">' + botaoCopiar(sec) + corpoSecao(sec, r, o) + '</div></section>';
}

/* blocos que dá para trazer do dia anterior, um a um */
const COPIAVEIS = { clima: 'Clima', maoDeObra: 'Equipe', atividades: 'Serviços em andamento', equipamentos: 'Equipamentos',
  observacoes: 'Observações' };
function botaoCopiar(sec) {
  const ant = App.rdoAnterior;
  if (!ant || !COPIAVEIS[sec]) return '';
  return '<button class="copiar-bloco" data-a="copiarBloco" data-s="' + sec + '">' + ic('copiar') +
    'Copiar do dia anterior (' + br(ant.data).slice(0, 5) + ')</button>';
}

function resumoSecao(sec, r) {
  const n = r.nada || {};
  switch (sec) {
    case 'clima': return r.clima.houve === false ? 'Sem expediente' + (r.clima.motivo ? ' — ' + r.clima.motivo : '') :
      [r.clima.manha && 'manhã: ' + rotClima(r.clima.manha), r.clima.tarde && 'tarde: ' + rotClima(r.clima.tarde)].filter(Boolean).join(' · ');
    case 'maoDeObra': { const t = totalMao(r); return t ? t + ' trabalhador' + (t > 1 ? 'es' : '') : ''; }
    case 'atividades': return r.atividades.length ? r.atividades.length + ' serviço(s)' : '';
    case 'equipamentos': { const t = Object.values(r.equipamentos).reduce((a, b) => a + (+b || 0), 0); return t ? t + ' em uso' : n.equipamentos ? 'nenhum hoje' : ''; }
    case 'fotos': return r.fotos.length ? r.fotos.length + ' foto(s)' : n.fotos ? 'sem fotos hoje' : '';
    case 'ocorrencias': return r.ocorrencias.length ? r.ocorrencias.length + ' registrada(s)' : n.ocorrencias ? 'nenhuma' : '';
    case 'seguranca': return [r.seguranca.dds === true ? 'DDS feito' : r.seguranca.dds === false ? 'sem DDS' : '',
      r.seguranca.acidente === true ? 'COM acidente' : r.seguranca.acidente === false ? 'sem acidente' : ''].filter(Boolean).join(' · ');
    case 'materiais': return r.materiais.length ? r.materiais.length + ' recebimento(s)' : n.materiais ? 'nenhum' : '';
    case 'visitas': return r.visitas.length ? r.visitas.length + ' visita(s)' : n.visitas ? 'nenhuma' : '';
    case 'observacoes': return (r.observacoes || '').trim() ? 'preenchido' : n.observacoes ? 'nada a observar' : '';
    case 'assinaturas': return r.assinaturas.responsavel.img ? 'assinado' + (r.assinaturas.fiscal.img ? ' (com fiscal)' : '') : '';
  }
  return '';
}
const rotClima = v => (CLIMA.find(c => c[0] === v) || [, ''])[1];

const botaoNada = (sec, r, txt) => (r.nada || {})[sec]
  ? '<button class="chip on" data-a="nada" data-sec="' + sec + '" style="margin-top:9px">' + ic('ok') + txt + '</button>'
  : '<button class="chip" data-a="nada" data-sec="' + sec + '" style="margin-top:9px">' + txt + '</button>';

function passo(acao, chave, v, extra) {
  return '<div class="passo"><button data-a="' + acao + '" data-k="' + esc(chave) + '" data-d="-1"' + (extra || '') + ' aria-label="menos">−</button>' +
    '<span class="num">' + (v || 0) + '</span><button data-a="' + acao + '" data-k="' + esc(chave) + '" data-d="1"' + (extra || '') + ' aria-label="mais">+</button></div>';
}

/* fileira de números: toca no 2 = 2 pessoas. De 8 em diante, o + continua contando. */
const qtdNova = (atual, el, max) => lim(el.dataset.v != null ? +el.dataset.v : (+atual || 0) + (+el.dataset.d), 0, max);
function numeros(acao, chave, v) {
  v = +v || 0;
  const at = ' data-a="' + acao + '" data-k="' + esc(chave) + '"';
  let h = '<div class="nums">';
  for (let n = 0; n <= 7; n++) h += '<button class="' + (v === n ? 'on' : '') + '"' + at + ' data-v="' + n + '">' + n + '</button>';
  if (v > 7) h += '<span class="grande on"><button' + at + ' data-d="-1" aria-label="menos um">−</button><b>' + v + '</b>' +
    '<button' + at + ' data-d="1" aria-label="mais um">+</button></span>';
  else h += '<button class="mais1"' + at + ' data-v="8" aria-label="8 ou mais">8+</button>';
  return h + '</div>';
}

const seletor = (acao, id, valor, vazio) => '<button class="seletor' + (valor ? '' : ' vazio') + '" data-a="' + acao + '" data-id="' + id + '">' +
  '<span>' + esc(valor || vazio) + '</span>' + ic('seta') + '</button>';

function corpoSecao(sec, r, o) {
  const n = r.nada || {};
  switch (sec) {
  case 'clima': {
    let h = '<div class="seg" style="margin-bottom:12px">' +
      '<button class="' + (r.clima.houve !== false ? 'on sim' : '') + '" data-a="houve" data-v="1">' + ic('capacete') + 'Teve trabalho</button>' +
      '<button class="' + (r.clima.houve === false ? 'on nao' : '') + '" data-a="houve" data-v="0">' + ic('x') + 'Não teve</button></div>';
    if (r.clima.houve === false) {
      return h + '<label class="rot">Motivo</label><div class="chips">' + MOTIVOS_PARADA.map(m =>
        '<button class="chip ' + (r.clima.motivo === m ? 'on' : '') + '" data-a="motivo" data-v="' + m + '">' + m + '</button>').join('') + '</div>';
    }
    ['manha', 'tarde'].forEach(t => {
      h += '<label class="rot">' + (t === 'manha' ? 'Manhã' : 'Tarde') + '</label><div class="seg">' +
        CLIMA.map(c => '<button class="' + (r.clima[t] === c[0] ? 'on' : '') + '" data-a="clima" data-t="' + t + '" data-v="' + c[0] + '">' +
          ic(c[2]) + c[1] + '</button>').join('') + '</div>';
    });
    h += '<div style="display:flex;align-items:center;gap:10px;margin-top:12px"><span style="flex:1;font-size:14.5px">Horas paradas por chuva</span>' +
      passo('horas', 'h', r.clima.horasParadas) + '</div>';
    if (r.clima.chuvaMm != null) h += '<p class="dica">' + ic('chuva') + 'Chuva registrada no dia: ' + String(r.clima.chuvaMm).replace('.', ',') + ' mm</p>';
    h += '<button class="btn fant" data-a="climaAuto" style="margin-top:6px;padding-left:0">' + ic('local') +
      (o.cidade ? 'Buscar o clima de ' + esc(o.cidade) : 'Clima automático (cadastre a cidade da obra)') + '</button>';
    return h;
  }
  case 'maoDeObra': {
    const funcs = Object.keys(r.maoDeObra);
    let h = funcs.map(f => '<div class="linha-num' + (r.maoDeObra[f] ? '' : ' zero') + '"><span class="nome">' + esc(f) + '</span>' +
      numeros('mao', f, r.maoDeObra[f]) + '</div>').join('');
    h += '<button class="mais" style="margin-top:10px" data-a="addFuncao">' + ic('mais') + 'Outra função</button>';
    if (r.terceiros.length) {
      h += '<label class="rot">Terceirizados</label>' + r.terceiros.map(t => '<div class="item"><div class="item-topo"><b>' + esc(t.empresa || 'Empresa') + '</b>' +
        '<button class="x" data-a="rmLista" data-lista="terceiros" data-id="' + t.id + '">' + ic('x') + '</button></div>' +
        '<input class="campo" placeholder="Empresa" value="' + esc(t.empresa) + '" data-c="campoLista" data-lista="terceiros" data-id="' + t.id + '" data-k="empresa">' +
        '<input class="campo" style="margin-top:8px" placeholder="Serviço" value="' + esc(t.servico) +
        '" data-c="campoLista" data-lista="terceiros" data-id="' + t.id + '" data-k="servico">' +
        '<div class="linha-num"><span class="nome">Pessoas</span>' + numeros('terc', t.id, t.qtd) + '</div></div>').join('');
    }
    h += '<button class="mais" style="margin-top:8px" data-a="addTerceiro">' + ic('mais') + 'Empresa terceirizada</button>';
    h += '<div class="total"><span>Total no canteiro</span><span class="num">' + totalMao(r) + '</span></div>';
    return h;
  }
  case 'atividades': {
    let h = r.atividades.map((a, i) => '<div class="item"><div class="item-topo"><b>Serviço ' + (i + 1) + '</b>' +
      '<button class="x" data-a="rmLista" data-lista="atividades" data-id="' + a.id + '" aria-label="Remover">' + ic('x') + '</button></div>' +
      seletor('frente', a.id, a.frente, 'Escolher a frente de serviço') +
      '<textarea class="campo" style="min-height:70px" placeholder="O que foi feito (ex.: alvenaria do bloco A, 1º pavimento)" data-c="campoLista" data-lista="atividades" data-id="' +
        a.id + '" data-k="descricao">' + esc(a.descricao) + '</textarea>' +
      '<div class="seg" style="margin-top:8px">' + STATUS_ATIV.map(s => '<button class="' + (a.status === s[0] ? 'on' : '') +
        '" data-a="statusAtiv" data-id="' + a.id + '" data-v="' + s[0] + '" style="font-size:12.5px;padding:8px 2px">' + s[1] + '</button>').join('') + '</div></div>').join('');
    h += '<button class="mais" data-a="addAtividade">' + ic('mais') + 'Adicionar serviço</button>';
    h += '<p class="dica">' + ic('mic') + 'No celular, toque no microfone do teclado para ditar em vez de digitar.</p>';
    return h;
  }
  case 'equipamentos': {
    let h = Object.keys(r.equipamentos).map(e => '<div class="linha-num' + (r.equipamentos[e] ? '' : ' zero') + '"><span class="nome">' + esc(e) + '</span>' +
      numeros('equip', e, r.equipamentos[e]) + '</div>').join('');
    h += '<button class="mais" style="margin-top:10px" data-a="addEquip">' + ic('mais') + 'Outro equipamento</button>';
    if (!Object.values(r.equipamentos).some(v => v > 0)) h += botaoNada('equipamentos', r, 'Nenhum equipamento hoje');
    return h;
  }
  case 'fotos': {
    let h = '<div class="camera"><label class="btn pri">' + ic('camera') + 'Tirar foto<input type="file" accept="image/*" capture="environment" multiple data-c="foto"></label>' +
      '<label class="btn sec">' + ic('galeria') + 'Da galeria<input type="file" accept="image/*" multiple data-c="foto"></label></div>';
    h += '<div id="fotoStatus"></div>';
    if (r.fotos.length) h += '<div class="galeria">' + r.fotos.map(f => '<button class="foto" data-a="editarFoto" data-id="' + f.id + '">' +
      '<img data-foto="' + f.id + '" alt="' + esc(f.legenda || 'foto') + '"><span class="leg">' + esc(f.legenda || 'toque para legendar') + '</span></button>').join('') + '</div>';
    else h += botaoNada('fotos', r, 'Sem fotos hoje');
    return h;
  }
  case 'ocorrencias': {
    let h = r.ocorrencias.map(x => '<div class="item"><div class="item-topo"><b>' + esc(x.tipo || 'Ocorrência') + '</b>' +
      '<button class="x" data-a="rmLista" data-lista="ocorrencias" data-id="' + x.id + '">' + ic('x') + '</button></div>' +
      seletor('tipoOcor', x.id, x.tipo, 'Escolher o tipo de ocorrência') +
      '<textarea class="campo" style="min-height:64px" placeholder="O que aconteceu e o que foi feito" data-c="campoLista" data-lista="ocorrencias" data-id="' +
        x.id + '" data-k="descricao">' + esc(x.descricao) + '</textarea>' +
      '<div style="display:flex;align-items:center;gap:10px;margin-top:8px"><span style="flex:1;font-size:14px">Dias de atraso que isso causa</span>' +
        passo('impacto', x.id, x.impacto) + '</div></div>').join('');
    h += '<button class="mais" data-a="addOcorrencia">' + ic('mais') + 'Registrar ocorrência</button>';
    if (!r.ocorrencias.length) h += botaoNada('ocorrencias', r, 'Sem ocorrências hoje');
    return h;
  }
  case 'seguranca': {
    const s = r.seguranca;
    const sn = (k, rot) => '<label class="rot">' + rot + '</label><div class="seg"><button class="' + (s[k] === true ? 'on sim' : '') +
      '" data-a="seg" data-k="' + k + '" data-v="1">Sim</button><button class="' + (s[k] === false ? 'on nao' : '') +
      '" data-a="seg" data-k="' + k + '" data-v="0">Não</button></div>';
    let h = sn('dds', 'Teve DDS (diálogo de segurança)?');
    if (s.dds) h += '<div class="chips" style="margin-top:9px">' + TEMAS_DDS.map(t => '<button class="chip ' + (s.tema === t ? 'on' : '') +
      '" data-a="temaDds" data-v="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div>';
    h += sn('acidente', 'Houve acidente ou incidente?');
    if (s.acidente) h += '<textarea class="campo" style="margin-top:9px" placeholder="Quem, o que houve, providência, CAT emitida?" data-c="segTxt">' +
      esc(s.descAcidente) + '</textarea>';
    return h;
  }
  case 'materiais': {
    let h = r.materiais.map(m => '<div class="item"><div class="item-topo"><b>' + esc(m.material || 'Material') + '</b>' +
      '<button class="x" data-a="rmLista" data-lista="materiais" data-id="' + m.id + '">' + ic('x') + '</button></div>' +
      ['material:Material', 'qtd:Quantidade', 'fornecedor:Fornecedor', 'nf:Nota fiscal'].map(c => { const [k, p] = c.split(':');
        return '<input class="campo" style="margin-bottom:6px" placeholder="' + p + '" value="' + esc(m[k]) + '" data-c="campoLista" data-lista="materiais" data-id="' + m.id + '" data-k="' + k + '">'; }).join('') + '</div>').join('');

    if (!r.visitas.length) h += botaoNada('visitas', r, 'Sem visitas hoje');
    return h;
  }
  case 'observacoes': {
    let h = '<textarea class="campo" placeholder="Comunicações à fiscalização, determinações recebidas, pendências…" data-c="obs">' + esc(r.observacoes) + '</textarea>' +
      '<p class="dica">' + ic('mic') + 'Dá para ditar pelo microfone do teclado.</p>';
    if (!(r.observacoes || '').trim()) h += botaoNada('observacoes', r, 'Nada a observar');
    return h;
  }
  case 'assinaturas': {
    return ['responsavel', 'fiscal'].map(q => {
      const a = r.assinaturas[q];
      return '<label class="rot">' + (q === 'responsavel' ? 'Responsável técnico' : 'Fiscalização (opcional)') + '</label>' +
        '<input class="campo" style="margin-bottom:8px" placeholder="Nome" value="' + esc(a.nome) + '" data-c="assNome" data-q="' + q + '">' +
        (a.img ? '<img class="assin-img" src="' + a.img + '" alt="assinatura"><button class="btn fant" data-a="refazerAss" data-q="' + q + '">Assinar de novo</button>'
               : '<canvas class="assin" data-ass="' + q + '"></canvas><div style="display:flex;gap:8px;margin-top:6px">' +
                 '<button class="btn fant" data-a="limparAss" data-q="' + q + '">Limpar</button><span style="flex:1"></span>' +
                 '<button class="btn sec" data-a="salvarAss" data-q="' + q + '">' + ic('ok') + 'Confirmar assinatura</button></div>');
    }).join('<div style="height:8px"></div>');
  }
  }
  return '';
}

/* ---------------- gravação automática ---------------- */
/* A memória é atualizada na hora; só a escrita em disco espera um instante
 * (um cronômetro por dia, para trocar de dia rápido não descartar nada). */
const _tGrava = {};
function alterado(secRedesenhar) {
  const r = App.rdoAtual;
  r.atualizadoEm = new Date().toISOString();
  const k = chaveRdo(r.obraId, r.data);
  App.rdos[k] = JSON.parse(JSON.stringify(r));
  if (secRedesenhar) redesenhar(secRedesenhar);
  atualizarBarra();
  const s = $('#salvo'); if (s) s.textContent = 'Salvando…';
  clearTimeout(_tGrava[k]);
  _tGrava[k] = setTimeout(() => {
    delete _tGrava[k];
    Banco.gravar('rdos', k, App.rdos[k]).then(() => { const s2 = $('#salvo'); if (s2) s2.textContent = 'Salvo ✓'; })
      .catch(e => { toast('ERRO AO SALVAR: ' + e.message, 5000); });
  }, 400);
}
/* Se a pessoa fechar a aba no meio, grava o que estiver pendente. */
window.addEventListener('pagehide', () => Object.keys(_tGrava).forEach(k => { clearTimeout(_tGrava[k]); Banco.gravar('rdos', k, App.rdos[k]); }));
document.addEventListener('visibilitychange', () => { if (document.hidden) Object.keys(_tGrava).forEach(k => { clearTimeout(_tGrava[k]); delete _tGrava[k]; Banco.gravar('rdos', k, App.rdos[k]); }); });
function redesenhar(sec) {
  const r = App.rdoAtual, o = App.obraAtual;
  if (sec === '*') {
    $('#cartoes').innerHTML = secoesVisiveis(o, r).map(s => cartao(s, r, o)).join('');
    carregarMiniaturas(); montarAssinaturas(); return;
  }
  const el = $('#c-' + sec); if (!el) return;
  const novo = document.createElement('div'); novo.innerHTML = cartao(sec, r, o);
  el.replaceWith(novo.firstChild);
  if (sec === 'fotos') carregarMiniaturas();
  if (sec === 'assinaturas') montarAssinaturas();
}
function atualizarBarra() {
  const r = App.rdoAtual, o = App.obraAtual;
  const vis = secoesVisiveis(o, r), ok = vis.filter(s => preenchida(s, r)).length;
  const p = $('#prog'); if (p) p.innerHTML = '<b class="num">' + ok + '/' + vis.length + '</b>blocos';
  const b = $('#btConcluir'); if (b) b.className = 'btn ' + (ok === vis.length ? 'verde' : 'pri');
  vis.forEach(s => {
    const c = $('#c-' + s); if (!c) return;
    const m = c.querySelector('.marca-ok,.marca-vazia');
    if (m) m.outerHTML = preenchida(s, r) ? '<span class="marca-ok">' + ic('ok') + '</span>' : '<span class="marca-vazia"></span>';
    const rs = c.querySelector('.resumo'); if (rs) rs.textContent = resumoSecao(s, r);
  });
}

/* ---------------- concluir ---------------- */
function concluirDia() {
  const r = App.rdoAtual, o = App.obraAtual;
  const faltam = secoesVisiveis(o, r).filter(s => !preenchida(s, r));
  const fechar = () => {
    r.status = 'concluido'; r.concluidoEm = r.concluidoEm || new Date().toISOString();
    alterado();
    setTimeout(() => { toast('Diário de ' + br(r.data) + ' fechado'); ir('#/obra/' + o.id + '/diario'); }, 500);
  };
  if (!faltam.length) return fechar();
  abrirFolha('<h3>Ficaram ' + faltam.length + ' bloco(s) sem preencher</h3>' +
    '<p style="color:var(--tinta2);margin:0 0 10px;font-size:14.5px">Nada é obrigatório. Você pode completar agora ou fechar assim mesmo.</p>' +
    faltam.map(s => { const d = SECOES.find(x => x[0] === s);
      return '<button class="item" style="width:100%;display:flex;align-items:center;gap:10px;text-align:left" data-a="irSecao" data-s="' + s + '">' +
        '<span class="ico" style="width:32px;height:32px;display:grid;place-items:center;color:var(--aco)">' + ic(d[2]) + '</span>' +
        '<b style="flex:1">' + d[1] + '</b><span style="color:var(--acao);font-weight:600;font-size:14px">Preencher</span></button>'; }).join('') +
    '<div style="display:flex;gap:9px;margin-top:12px"><button class="btn sec" style="flex:1" data-a="fecharFolha">Voltar</button>' +
    '<button class="btn verde" style="flex:1" data-a="fecharMesmoAssim">Fechar assim mesmo</button></div>',
    f => { App._fechar = fechar; });
}

function escolherDaLista(titulo, itens, aoEscolher, livre) {
  abrirFolha('<h3>' + esc(titulo) + '</h3>' +
    '<input class="campo" id="filtroLista" placeholder="Procurar ou digitar um novo…" style="margin-bottom:10px">' +
    '<div class="chips" id="listaEsc">' + itens.map(f => '<button class="chip" data-v="' + esc(f) + '">' + esc(f) + '</button>').join('') + '</div>' +
    '<button class="btn sec cheio" id="usarDigitado" style="margin-top:12px;display:none"></button>',
    f => {
      const filtro = $('#filtroLista', f), usar = $('#usarDigitado', f);
      f.querySelectorAll('#listaEsc .chip').forEach(c => c.onclick = () => { fecharFolha(); aoEscolher(c.dataset.v); });
      filtro.oninput = () => {
        const t = filtro.value.trim().toLowerCase();
        f.querySelectorAll('#listaEsc .chip').forEach(c => c.style.display = c.dataset.v.toLowerCase().includes(t) ? '' : 'none');
        usar.style.display = t ? '' : 'none'; usar.textContent = 'Usar "' + filtro.value.trim() + '"';
      };
      usar.onclick = () => { const v = filtro.value.trim(); if (v) { fecharFolha(); aoEscolher(v); } };
    });
}

function copiarBloco(sec) {
  const r = R(), ant = App.rdoAnterior;
  if (!ant) return;
  const c = JSON.parse(JSON.stringify(ant));
  if (sec === 'clima') { ['houve', 'motivo', 'manha', 'tarde', 'horasParadas'].forEach(k => r.clima[k] = c.clima[k]); }
  else if (sec === 'maoDeObra') { r.maoDeObra = c.maoDeObra; r.terceiros = c.terceiros.map(t => Object.assign(t, { id: uid() })); }
  else if (sec === 'atividades') {
    const novas = c.atividades.filter(a => a.status !== 'concluida').map(a => Object.assign(a, { id: uid(), status: 'andamento' }));
    if (!novas.length) return toast('No dia ' + br(ant.data) + ' não ficou serviço em andamento');
    r.atividades = r.atividades.filter(a => (a.descricao || '').trim() || a.frente).concat(novas);
  }
  else if (sec === 'equipamentos') { r.equipamentos = c.equipamentos; if (Object.values(r.equipamentos).some(v => v > 0)) delete r.nada.equipamentos; }
  else if (sec === 'observacoes') { r.observacoes = c.observacoes || ''; }
  alterado();
  redesenhar(sec === 'clima' ? '*' : sec);
  toast('Copiado de ' + br(ant.data) + ': ' + COPIAVEIS[sec] + ' — mude o que for diferente');
}

function copiarAnterior() {
  const o = App.obraAtual, r = R();
  const ant = rdosDa(o.id).filter(x => x.data < r.data).sort((a, b) => b.data < a.data ? -1 : 1)[0];
  if (!ant) return;
  const c = JSON.parse(JSON.stringify(ant));
  r.maoDeObra = c.maoDeObra; r.terceiros = c.terceiros.map(t => Object.assign(t, { id: uid() }));
  r.equipamentos = c.equipamentos;
  r.atividades = c.atividades.filter(a => a.status !== 'concluida').map(a => Object.assign(a, { id: uid(), status: 'andamento' }));
  r.assinaturas.responsavel.nome = c.assinaturas.responsavel.nome || r.assinaturas.responsavel.nome;
  r.clima.houve = true;
  alterado();
  toast('Copiado de ' + br(ant.data) + ' — revise o que mudou');
  render();
}

  if (el.form && el.form.id === 'formObra' && (el.name === 'inicio' || el.name === 'prazoDias')) {
    const t = $('#terminoObra'); if (t) t.textContent = textoTermino(el.form.inicio.value, el.form.prazoDias.value);
  }
  if (!c) return;
  if (c === 'campoLista') { const x = achar(el.dataset.lista, el.dataset.id); x[el.dataset.k] = el.value; alterado(); }
  else if (c === 'obs') { R().observacoes = el.value; if (el.value.trim()) delete R().nada.observacoes; alterado(); }
  else if (c === 'segTxt') { R().seguranca.descAcidente = el.value; alterado(); }
  else if (c === 'assNome') { R().assinaturas[el.dataset.q].nome = el.value; alterado(); }
  else if (c === 'cfg') { App.config[el.dataset.k] = el.value; clearTimeout(A._tc); A._tc = setTimeout(salvarConfig, 400); }
});

document.addEventListener('change', e => {
  const el = e.target, c = el.dataset && el.dataset.c;
  if (!c || !el.files) return;
  const arqs = Array.from(el.files); el.value = '';
  if (!arqs.length) return;

  if (c === 'foto') {
    const r = R(), st = $('#fotoStatus');
    let i = 0;
    const prox = () => {
      if (i >= arqs.length) { if (st) st.innerHTML = ''; delete r.nada.fotos; alterado('fotos'); return; }
      if (st) st.innerHTML = '<p class="dica">Guardando foto ' + (i + 1) + ' de ' + arqs.length + '…</p>';
      const qd = new Date(arqs[i].lastModified || Date.now()), d2 = n => String(n).padStart(2, '0');
      const carimbo = d2(qd.getDate()) + '/' + d2(qd.getMonth() + 1) + '/' + qd.getFullYear() + ' ' + d2(qd.getHours()) + ':' + d2(qd.getMinutes());
      comprimirFoto(arqs[i], 1600, carimbo).then(blob => {
        const id = uid();
        return Banco.gravar('fotos', id, { id, obraId: r.obraId, data: r.data, blob }).then(() => r.fotos.push({ id, legenda: '' }));
      }).then(() => { i++; prox(); }).catch(err => { toast('Foto não salva: ' + err.message, 4000); i++; prox(); });
    };
    prox();
  }
  else if (c === 'anexarDoc') {
    const o = obraPor(App.rota.id), tipo = $('#docTipo').value, a = arqs[0];
    if (a.size > 50 * 1048576) return toast('Arquivo acima de 50 MB');
    const id = uid();
    Banco.gravar('docs', id, { id, nome: a.name, tipo: a.type, blob: a }).then(() => {
      o.docs = (o.docs || []).concat({ id, tipo, nome: a.name, tamanho: a.size, em: hojeIso() });
      return salvarObra(o);
    }).then(() => { toast(tipo + ' anexado'); render(); }).catch(err => toast('Não foi possível anexar: ' + err.message, 4000));
  }
  else if (c === 'logo') {
    comprimirFoto(arqs[0], 500).then(blobParaUrl).then(u => { App.config.logo = u; return salvarConfig(); }).then(() => { toast('Logo salvo'); render(); });
  }
  else if (c === 'restaurar') restaurarBackup(arqs[0]);
  else if (c === 'juntar') juntarBackups(arqs);
});
